<style>
:root{--bg:#f4f5fa;--c:#fff;--t:#1d2150;--m:#666b8d;--p:#2b2f86;--g:#e8b53a;--ok:#177a52;--bad:#b83227;--wr:#9a6410;--bd:#e1e3ef;--nav:#2b2f86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101230;--c:#1a1d46;--t:#eceefc;--m:#a2a8d6;--p:#9aa0ff;--bd:#2c3068;--ok:#4cc38a;--bad:#ff8a7d;--wr:#f1c15a;--nav:#171a4a}}
:root[data-theme="dark"]{--bg:#101230;--c:#1a1d46;--t:#eceefc;--m:#a2a8d6;--p:#9aa0ff;--bd:#2c3068;--ok:#4cc38a;--bad:#ff8a7d;--wr:#f1c15a;--nav:#171a4a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{min-height:100vh;min-height:100dvh}
body{background:var(--bg);color:var(--t);font:15px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;display:flex}
nav{background:var(--nav);color:#fff;width:210px;padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex:none;overflow:auto}
nav h1{font-size:17px;margin:4px 8px 14px;color:var(--g)}
nav a{color:#dfe1ff;text-decoration:none;padding:10px 12px;border-radius:10px;cursor:pointer}
nav a.on,nav a:hover{background:rgba(255,255,255,.14);color:#fff}
main{flex:1;overflow:auto;padding:20px;max-width:1100px;margin-inline:auto;width:100%}
h2{margin:0 0 14px;font-size:22px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px}
.k{color:var(--m);font-size:13px}.v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.g{background:var(--g);color:#2a2200}.btn.s{padding:4px 10px;font-size:13px;box-shadow:none}.btn.o{background:transparent;color:var(--p);border:1px solid var(--bd);box-shadow:none}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--c);color:var(--t);width:100%}
label{display:block;font-size:13px;color:var(--m);margin-bottom:10px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--m);font-size:13px;font-weight:600}tr.l{cursor:pointer}tr.l:hover{background:rgba(120,120,200,.08)}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.paid,.completed{color:var(--ok)}.cancelled{color:var(--m)}.suspended{color:var(--wr)}.overdue{color:var(--bad)}.due,.partial{color:var(--wr)}.upcoming,.scheduled,.active{color:var(--p)}
.auth{max-width:440px;margin:6vh auto}.auth h1{margin:0 0 4px;font-size:24px}.pw{display:flex;gap:6px}.pw input{flex:1}.ok{background:rgba(23,122,82,.14);color:var(--ok);padding:8px 12px;border-radius:10px;margin-bottom:10px}.rc{font:700 20px/1.6 ui-monospace,Menlo,monospace;direction:ltr;text-align:center;background:var(--bg);border:2px dashed var(--g);border-radius:12px;padding:14px;user-select:all}body.locked nav{display:none}hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
.gate{max-width:560px;margin:40px auto;text-align:center}.gate h2{margin-top:0}
.warn{background:rgba(232,181,58,.18);color:var(--wr);padding:8px 12px;border-radius:10px;margin-bottom:10px}
#sync{margin-top:auto;padding:8px 12px;font-size:12px;color:#cfd2ff}
.err{background:rgba(184,50,39,.12);color:var(--bad);padding:8px 12px;border-radius:10px;margin-bottom:10px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}

/* التعديل المصلح والنهائي لتجاوب شاشات الجوال العمودية */
@media(max-width:800px){
  input,select,textarea{font-size:16px}
  #sync{display:none}
  body{flex-direction:column !important} /* إجبار العناصر على الترتيب الرأسي المريح */
  nav{width:100% !important;flex-direction:row !important;padding:6px;overflow-x:auto;order:-1} /* شريط التنقل العلوي للجوال */
  nav h1{display:none}
  nav a{padding:8px 10px;font-size:13px;white-space:nowrap}
  main{padding:14px;width:100% !important;max-width:100% !important;box-sizing:border-box}
  .grid{grid-template-columns:1fr !important} /* عرض الكروت بشكل كامل ومريح للعين */
}
</style>
<script>

window.__ok=false;window.__show=show;
window.addEventListener('error',function(e){if(!window.__ok)show((e.message||'error')+' @'+(e.lineno||'')+':'+(e.colno||''))});
window.addEventListener('unhandledrejection',function(e){if(!window.__ok)show('promise: '+((e.reason&&e.reason.message)||e.reason))});})();
</script>
