:root{--bg:#f4f5fa;--c:#fff;--t:#1d2150;--m:#666b8d;--p:#2b2f86;--g:#e8b53a;--ok:#177a52;--bad:#b83227;--wr:#9a6410;--bd:#e1e3ef;--nav:#2b2f86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101230;--c:#1a1d46;--t:#eceefc;--m:#a2a8d6;--p:#9aa0ff;--bd:#2c3068;--ok:#4cc38a;--bad:#ff8a7d;--wr:#f1c15a;--nav:#171a4a}}

*{box-sizing:border-box}html,body{height:100%;margin:0}body{min-height:100vh;min-height:100dvh}
body{background:var(--bg);color:var(--t);font:15px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;display:flex}
nav{background:var(--nav);color:#fff;width:210px;padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex:none;overflow:auto}
nav h1{font-size:17px;margin:4px 8px 14px;color:var(--g)}
nav a{color:#dfe1ff;text-decoration:none;padding:10px 12px;border-radius:10px;cursor:pointer}
nav a.on,nav a:hover{background:rgba(255,255,255,.14);color:#fff}
main{flex:1;overflow:auto;padding:20px;max-width:1100px;margin-inline:auto;width:100%}
h2{margin:0 0 14px;font-size:22px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px}
.k{color:var(--m);font-size:13px}.v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.g{background:var(--g);color:#2a2200}.btn.s{padding:4px 10px;font-size:13px;box-shadow:none}.btn.o{background:transparent;color:var(--p);border:1px solid var(--bd);box-shadow:none}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--c);color:var(--t);width:100%}
label{display:block;font-size:13px;color:var(--m);margin-bottom:10px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--bd);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--m);font-size:13px;font-weight:600}tr.l{cursor:pointer}tr.l:hover{background:rgba(120,120,200,.08)}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.paid,.completed{color:var(--ok)}.cancelled{color:var(--m)}.suspended{color:var(--wr)}.overdue{color:var(--bad)}.due,.partial{color:var(--wr)}.upcoming,.scheduled,.active{color:var(--p)}
.auth{max-width:440px;margin:6vh auto}.auth h1{margin:0 0 4px;font-size:24px}.pw{display:flex;gap:6px}.pw input{flex:1}.ok{background:rgba(23,122,82,.14);color:var(--ok);padding:8px 12px;border-radius:10px;margin-bottom:10px}.rc{font:700 20px/1.6 ui-monospace,Menlo,monospace;direction:ltr;text-align:center;background:var(--bg);border:2px dashed var(--g);border-radius:12px;padding:14px;user-select:all}body.locked nav{display:none}hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
.gate{max-width:560px;margin:40px auto;text-align:center}.gate h2{margin-top:0}
.warn{background:rgba(232,181,58,.18);color:var(--wr);padding:8px 12px;border-radius:10px;margin-bottom:10px}
#sync{margin-top:auto;padding:8px 12px;font-size:12px;color:#cfd2ff}
.err{background:rgba(184,50,39,.12);color:var(--bad);padding:8px 12px;border-radius:10px;margin-bottom:10px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
/* 🛠️ التعديل الجذري والآمن للقائمة الجانبية المنسحبة في الجوال */
@media(max-width:800px){
  input,select,textarea{font-size:16px}
  #sync{display:none !important}
  body{flex-direction:row !important; position: relative;}
  
  /* تحويل القائمة لتصبح شريطاً نحيفاً ومخفياً تماماً على اليمين */
  nav{
    position: fixed !important;
    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 20px !important; /* تظهر فقط كخط رفيع أزرق على حافة الشاشة اليمنى */
    height: 100vh !important;
    background: var(--nav) !important;
    z-index: 99999 !important;
    flex-direction: column !important;
    padding: 10px 0 !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    transition: width 0.3s ease, padding 0.3s ease !important;
    border-left: 3px solid var(--g) !important;
  }
  
  /* بمجرد لمس الحافة اليمنى للشاشة أو تمرير الإصبع فوقها تفتح القائمة بالكامل */
  nav:active, nav:hover, nav:focus-within {
    width: 210px !important;
    padding: 16px 10px !important;
  }
  
  nav h1{font-size:15px !important; text-align:center; display:block !important;}
  nav a{
    padding: 10px 12px !important; 
    font-size: 14px !important; 
    white-space: nowrap !important;
    width: 100% !important;
    display: block !important;
  }
  
  /* إعطاء مساحة مريحة للمحتوى الرئيسي لكي لا يختفي تحت الشريط الأزرق */
  main{
    padding: 14px 30px 14px 14px !important; 
    width:100% !important; 
    max-width:100% !important; 
    box-sizing:border-box
  }
  .grid{grid-template-columns:1fr !important}
}

 else if(k=='resume'){const sus=db.sus.find(x=>x.c==c.id&&!x.v&&!x.r),r0=val('ac_d'),m=val('ac_m'),n=parseInt(val('ac_n')||'0');if(!sus||!isD(r0)||r0<sus.s)return err(t('e_date'));
  if(m=='shift'){if(!(n>=1&&n<=60))return err(t('e_num'));let cnt=0;liveIns(c).forEach(x=>{if(remOf(x)>0){x.d=addM(x.d,n);cnt++}});logE('shift','commitment',c.id,c.id,`${cnt} × +${n}`)}
  sus.r=r0;sus.act=m;logE('resume','commitment',c.id,c.id,`${r0} · ${m}`)}
 else if(k=='rule'){if(need())return;const ef=val('ac_d'),a=parse(val('ac_a'));if(!isD(ef)||isNaN(a)||a<=0)return err(t('e_num'));const last=c.rr[c.rr.length-1];if(ef<=last.ef)return err(t('e_rule_order'));

function doSettle(c){
 const s=sum(c),d=val('st_d'),ac=val('st_a'),why=val('ac_r').trim(),cash=val('st_c')===''?0:parse(val('st_c')),f=m=>(err(t(m)),false);
 if(!why)return f('e_reason');if(c.rr)return f('e_nosettle');if(db.set.some(x=>x.c==c.id&&!x.v))return f('e_overlap2');
 if(!isD(d)||d>today)return f('e_future');if(isNaN(cash)||cash<0||cash>s.rem)return f('e_num');
 const a0=db.accs.find(x=>x.id==ac);if(cash>0&&!a0)return f('e_acc');if(cash>0&&a0.od&&d<a0.od)return f('e_before');
 const open=s.l.filter(i=>remOf(i)>0).sort((a,b)=>a.d<b.d?-1:1);if(!open.length)return f('e_num');
 const set={id:id(),c:c.id,d,why,v:false};db.set.push(set);let left=cash,pid=null;
 if(cash>0){pid=id();db.pays.push({id:pid,a:ac,d,m:val('st_m'),nt:why,v:false})}
 open.forEach(i=>{const r=remOf(i),cp=Math.min(r,left);left-=cp;if(cp>0)db.al.push({id:id(),p:pid,i:i.id,a:cp,s:set.id});if(r-cp>0)db.wv.push({id:id(),s:set.id,i:i.id,a:r-cp})});
 logE('settle','commitment',c.id,c.id,`${t('st_cash')} ${fmt(cash)} · ${t('waived')} ${fmt(s.rem-cash)} · ${why}`);return true}
const voidSet=sid=>two('vs'+sid,()=>{const x=db.set.find(y=>y.id==sid);if(!x)return;x.v=true;logE('void_settlement','commitment',x.c,x.c,x.why);save();draw()});
const setSummary=c=>{const l=db.set.filter(x=>x.c==c.id);if(!l.length)return'';return`<h3>${t('a_settle')}</h3>`+tbl(['date','st_cash','waived','status','note',''],l.map(x=>{const cash=db.al.filter(a=>a.s==x.id&&!pv(a.p)).reduce((s,a)=>s+a.a,0),w=db.wv.filter(y=>y.s==x.id).reduce((s,y)=>s+y.a,0);return`<tr><td>${x.d}</td><td>${fmt(cash)}</td><td>${fmt(w)}</td><td>${x.v?`<span class="chip overdue">${t('voided')}</span>`:chip('completed')}</td><td style="white-space:normal">${esc(x.why)}</td><td>${x.v?'':`<button class="btn s o" onclick="voidSet('${x.id}')">${pend=='vs'+x.id?t('cfm'):t('void')}</button>`}</td></tr>`}).join(''))};

function addTrf(aid){const a=db.accs.find(x=>x.id==aid),to=db.accs.find(x=>x.id==val('tt')),d=val('td'),m=parse(val('ta')),e0=chkMv(a,d,m);if(e0)return err(e0);if(!to||to.id==aid)return err(t('e_acc2'));if(to.od&&d<to.od)return err(t('e_before'));
 db.trf.push({id:id(),f:aid,t:to.id,d,m,nt:val('tn').trim(),v:false});logE('transfer','account',aid,aid,`${a.n} → ${to.n} · ${fmt(m)} · ${d}`);save();draw()}
function voidMv(src,id2){two('m'+id2,()=>{const x=(src=='mv'?db.mv:db.trf).find(y=>y.id==id2);if(!x)return;x.v=true;logE(src=='mv'?'void_movement':'void_transfer','account',x.a||x.f,x.a||x.f,fmt(x.m)+' · '+x.d);save();draw()})}
function ents(){return`<h2>${t('ents')}</h2><div class="card"><div class="f"><label>${t('f_ent')}*<input id="en"></label><label>${t('type')}<select id="et">${ET.map(x=>`<option value="${x}">${t('et_'+x)}</option>`).join('')}</select></label></div><button class="btn" onclick="addE()">${t('add')}</button></div><br>`+tbl(['name','type','cnt'],db.ents.map(e=>`<tr><td>${esc(e.n)}</td><td>${t('et_'+e.k)}</td><td>${db.coms.filter(c=>c.e==e.id).length}</td></tr>`).join(''))}
function addE(){const n=val('en').trim();if(!n)return err(t('e_req'));if(db.ents.some(e=>nz(e.n)==nz(n)))return err(t('e_req'));db.ents.push({id:id(),n,k:val('et')});save();draw()}
function cats(){return`<h2>${t('cats')}</h2><div class="card"><div class="f"><label>${t('f_cat')}*<input id="cn"></label></div><button class="btn" onclick="addC()">${t('add')}</button></div><br>`+tbl(['name','cnt'],db.cats.map(c=>`<tr><td>${esc(nm(c,'c_'))}</td><td>${db.coms.filter(x=>x.k==c.id).length}</td></tr>`).join(''))}
function addC(){const n=val('cn').trim();if(!n)return err(t('e_req'));db.cats.push({id:id(),n});save();draw()}
function reps(){const g=(arr,key,lab)=>tbl(['name','total','paid','waived','rem'],arr.map(o=>{const x=db.coms.filter(c=>c[key]==o.id).map(sum),T=x.reduce((s,y)=>s+y.tot,0),P=x.reduce((s,y)=>s+y.p,0),W=x.reduce((s,y)=>s+y.w,0);return T?`<tr><td>${esc(lab(o))}</td><td>${fmt(T)}</td><td>${fmt(P)}</td><td>${fmt(W)}</td><td>${fmt(T-P-W)}</td></tr>`:''}).join(''));
 return`<div class="top"><h2>${t('reps')}</h2><span><button class="btn o s" onclick="csv('i')">${t('exp_i')}</button> <button class="btn o s" onclick="csv('p')">${t('exp_p')}</button> <button class="btn o s" onclick="csv2('m')">${t('exp_m')}</button> <button class="btn o s" onclick="csv2('t')">${t('exp_t')}</button> <button class="btn o s" onclick="csv2('l')">${t('exp_l')}</button></span></div>${monthReport()}<h3>${t('by_e')}</h3>${g(db.ents,'e',e=>e.n)}<h3>${t('by_c')}</h3>${g(db.cats,'k',c=>nm(c,'c_'))}`}
function csv(w){const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
 const rows=w=='i'?[['commitment','due','amount','paid','waived','remaining','status'],...db.ins.map(i=>[db.coms.find(c=>c.id==i.c)?.n,i.d,i.a/100,paid(i)/100,wvOf(i)/100,remOf(i)/100,st(i)])]:[['date','amount','account','method','voided'],...db.pays.map(p=>[p.d,pt(p)/100,db.accs.find(a=>a.id==p.a)?.n,p.m,p.v])];
 dl('\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),w+'.csv','text/csv')}
function dl(s,n,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:m}));a.download=n;a.click()}
